<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>City24 Config Decoder</title>
<style>
:root{color-scheme:light;--ink:#203047;--muted:#6b7788;--line:#dce4ed;--blue:#2769a6;--bg:#f3f6fa;--pale:#f5f8fc}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eef4fa,#f8fafc);font:14px "Segoe UI",Arial,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:16px}
.app{width:min(790px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 18px 55px #263b5518;overflow:hidden}
header{padding:25px 30px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:15px}
.logo{width:46px;height:46px;border-radius:13px;background:#e8f2fc;color:var(--blue);display:grid;place-items:center;font-size:23px;font-weight:700}
h1{font-size:21px;margin:0 0 4px;letter-spacing:.3px}.sub{color:var(--muted);font-size:13px}
main{padding:26px 30px 30px}
.drop{border:2px dashed #9bb8d5;border-radius:13px;background:#f7fbff;min-height:112px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:14px 18px;transition:.15s}
.drop.over{background:#eaf4ff;border-color:#2878bd;transform:scale(1.005)}
.drop .glyph{font-size:27px;color:#4b83b7;margin-bottom:4px}.drop strong{font-size:15px}.drop p{margin:4px 0 9px;color:var(--muted);font-size:12px}
button,.filebtn{border:0;border-radius:9px;background:var(--blue);color:white;padding:10px 17px;font:600 14px "Segoe UI",sans-serif;cursor:pointer}
button:hover,.filebtn:hover{background:#1e568c}.secondary{background:#edf2f7;color:#34465c}.secondary:hover{background:#e1e9f1}
#file{display:none}.status{margin:18px 2px 12px;color:var(--muted);font-size:13px;min-height:20px}
.panel{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panelhead{padding:12px 15px;background:#f8fafc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:650}
#result{padding:14px;min-height:150px;max-height:440px;overflow:auto;background:#fff}.report-file{margin:0 0 16px}.report-file:last-child{margin-bottom:0}.report-title{display:flex;align-items:center;gap:8px;margin:0 0 11px;padding:0 2px;color:#52647b;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.report-title:before{content:"";width:4px;height:17px;border-radius:4px;background:#397db7}.report-section{margin:0 0 12px;border:1px solid #e5ebf2;border-radius:10px;overflow:hidden}.report-section h3{margin:0;padding:9px 12px;background:#f4f7fb;color:#35516f;font-size:12px;letter-spacing:.035em}.report-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:9px}.report-item{min-width:0;padding:9px 10px;background:#f8fafc;border:1px solid #edf1f5;border-radius:8px}.report-label{display:block;color:#718096;font-size:11px;margin-bottom:4px}.report-value{display:block;color:#263b53;font-size:13px;font-weight:600;overflow-wrap:anywhere}.report-error{padding:13px;border:1px solid #f2caca;background:#fff7f7;border-radius:9px;color:#a52222;white-space:pre-wrap}
.actions{display:flex;gap:9px}.actions button{padding:7px 12px;font-size:12px}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:13px 2px 0}
footer{padding:13px 30px;background:#fafbfd;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.good{color:#198754}.bad{color:#b42318}
@media(max-width:600px){body{padding:8px}main{padding:13px}.report-grid{grid-template-columns:1fr}.panelhead{align-items:flex-start;gap:10px;flex-direction:column}}
</style>
</head>
<body>
<div class="app">

<main>
<div id="drop" class="drop">
 <div class="glyph">⇩</div><strong>Перетягніть сюди файл конфігурації або архів</strong>
 <p>Підтримуються .config та .7z · Також можна вибрати файл вручну</p>
 <label class="filebtn" for="file">Вибрати файл</label><input id="file" type="file" accept=".config,.7z">
</div>
<div id="status" class="status">Очікування файлу…</div>
<div class="panel"><div class="panelhead"><span>Результат розшифрування</span><div class="actions"><button id="save" class="secondary" disabled>Зберегти TXT</button><button id="clear" class="secondary">Очистити</button></div></div><div id="result"><div class="report-empty">Тут з’явиться розшифрування параметрів City24.</div></div></div>
</main>
</div>

<script>
const $=id=>document.getElementById(id);
let lastText='',lastName='city24.decoded.txt';
function setStatus(t,ok=true){$('status').textContent=t;$('status').className='status '+(ok?'good':'bad')}
function txt(x,tag){const n=x.getElementsByTagName(tag)[0];return n?n.textContent.trim():null}
function clock(v){const n=Number(v);return Number.isFinite(n)&&n>=0?String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0'):v}
function bool(v,mode='normal'){if(v===null)return null;const yes=/^true$/i.test(v);if(mode==='inverse')return yes?'Ні':'Так';if(mode==='yesno')return yes?'Так':'Ні';return yes?'Увімкнено':'Вимкнено'}
function renderReport(text){
 const host=$('result');host.replaceChildren();
 const reports=text.split(/\r?\n={20,}\r?\n/);
 reports.forEach(report=>{
  const lines=report.split(/\r?\n/).filter(Boolean);if(!lines.length)return;
  const wrap=document.createElement('div');wrap.className='report-file';
  const title=document.createElement('div');title.className='report-title';title.textContent=lines[0];wrap.appendChild(title);
  let section=null,grid=null;
  lines.slice(1).forEach(line=>{
   if(line===lines[1]&&line.startsWith('Файл:')){const meta=document.createElement('div');meta.className='report-item';meta.style.marginBottom='9px';const lab=document.createElement('span');lab.className='report-label';lab.textContent='ФАЙЛ';const val=document.createElement('span');val.className='report-value';val.textContent=line.slice(5).trim();meta.append(lab,val);wrap.appendChild(meta);return}
   if(/^[А-ЯІЇЄҐ’'0-9 ][А-ЯІЇЄҐ’'0-9 _-]{3,}$/.test(line)&&!line.includes(':')){
    section=document.createElement('section');section.className='report-section';
    const h=document.createElement('h3');h.textContent=line;section.appendChild(h);
    grid=document.createElement('div');grid.className='report-grid';section.appendChild(grid);wrap.appendChild(section);return;
   }
   const pos=line.indexOf(':');if(pos<0)return;
   if(!section){section=document.createElement('section');section.className='report-section';grid=document.createElement('div');grid.className='report-grid';section.appendChild(grid);wrap.appendChild(section)}
   const item=document.createElement('div');item.className='report-item';
   const label=document.createElement('span');label.className='report-label';label.textContent=line.slice(0,pos).trim();
   const value=document.createElement('span');value.className='report-value';value.textContent=line.slice(pos+1).trim();
   item.append(label,value);grid.appendChild(item);
  });
  host.appendChild(wrap);
 });
}
function decodeConfig(text,name){
 const doc=new DOMParser().parseFromString(text,'application/xml');
 if(doc.querySelector('parsererror'))throw new Error('Файл не є коректним XML або має помилку структури.');
 const lines=['РОЗШИФРУВАННЯ КОНФІГУРАЦІЇ CITY24','Файл: '+name,'','ЗАГАЛЬНІ НАЛАШТУВАННЯ'];
 const add=(tag,label,mode)=>{const v=txt(doc,tag);if(v!==null){let out=v;if(mode==='bool'||mode==='inverse'||mode==='yesno')out=bool(v,mode);if(mode==='minutes')out=v+' хв.';if(mode==='clock')out=clock(v);lines.push(label+': '+out)}};
 add('EnableModemReset','IT-команди','bool');
 add('UseHibernationRestart','Гибернация','bool');
 add('UseBiosRestart',"Перевод часу при відсутності зв'язку",'bool');
 add('BiosRestartTimeout',"При відсутності зв'язку переводити час через",'minutes');
 add('BiosRestartMinutesTimespan','Переводити час на','clock');
 add('RebootTimeout',"При відсутності зв'язку перезавантаження через",'minutes');
 const con=[...doc.getElementsByTagName('*')].filter(n=>n.children&&n.querySelector(':scope > Name')&&n.querySelector(':scope > Priority'));
 if(con.length){lines.push('','ПРІОРИТЕТИ З’ЄДНАННЯ');con.forEach(n=>lines.push("Пріоритет з'єднання "+n.querySelector(':scope > Priority').textContent.trim()+': '+n.querySelector(':scope > Name').textContent.trim()))}
 lines.push('','НАЛАШТУВАННЯ ПРИНТЕРА');
 add('Type','Модель принтера');add('Port','Порт принтера');add('CharSize','Шрифт');
 add('PrintAsRasterImage','Друк картинкою','bool');add('EncashmentCheckType','Тип чеку інкаса');
 lines.push('','ІНТЕРФЕЙС ТА ЕКРАН');
 add('AdvertisementPlayerEnabled','Модуль реклами','bool');
 let m=txt(doc,'OnlyOneMonitor');if(m!==null)lines.push('Кількість моніторів: '+(/^true$/i.test(m)?'1':(/^false$/i.test(m)?'2':m)));
 add('Skin','Назва скіну інтерфейсу');add('DisableAutoSkinSwitching','Вмикання скіну за графіком','inverse');
 const a=txt(doc,'LightThemeFrom'),b=txt(doc,'LightThemeTo');if(a!==null&&b!==null)lines.push('Період світлої теми: з '+clock(a)+' по '+clock(b));
 add('SetDispalyResulitionAfrterStart','Встановлювати роздільну здатність при старті','yesno');
 const w=doc.querySelector('MainDisplayResolution Width'),h=doc.querySelector('MainDisplayResolution Height');if(w&&h)lines.push('Стартувати з роздільною здатністю: '+w.textContent.trim()+' x '+h.textContent.trim());
 add('SelectedValidator','Тип купюроприймача');
 const tasks=[...doc.getElementsByTagName('SystemTaskSetting')].filter(t=>{const e=t.getElementsByTagName('EventType')[0];return e&&e.textContent.trim()==='Shutdown'});
 if(tasks.length){lines.push('','КЕРУВАННЯ ЖИВЛЕННЯМ ТЕРМІНАЛА');tasks.forEach(t=>{[['BeginTime','Вимикати термінал о'],['EndTime','Не давати вмикатися до']].forEach(([tag,label])=>{const v=txt(t,tag);if(v!==null)lines.push(label+': '+clock(v))});[['IsEnabled','Завдання активне'],['ExecutedInSpecifiedTimeInterval','Виконувати у визначеному часовому інтервалі']].forEach(([tag,label])=>{const v=txt(t,tag);if(v!==null)lines.push(label+': '+bool(v))})})}
 return lines.join('\r\n');
}
let filingWasmUrl='./vendor/archive.wasm';
async function ensureFiling(){
 if(window.filing && window.filing.FilingBrowser)return;
 const src='./vendor/filing.min.js';
 try{
  await new Promise((resolve,reject)=>{
   const s=document.createElement('script');s.src=src;s.async=true;
   s.onload=()=>resolve();s.onerror=()=>reject(new Error('Не вдалося завантажити локальну бібліотеку '+src));
   document.head.appendChild(s);
  });
  if(window.filing && window.filing.FilingBrowser)return;
  throw new Error('Локальна бібліотека завантажилась, але FilingBrowser не знайдено.');
 }catch(e){
  throw new Error('Не вдалося завантажити вбудовану бібліотеку 7-Zip. '+e.message+' Перезавантажте сторінку через Ctrl+F5.');
 }
}
async function processFile(file){
 try{
  setStatus('Обробка: '+file.name);
  let configs=[];
  if(file.name.toLowerCase().endsWith('.config')) configs=[{filename:file.name,file}];
  else if(file.name.toLowerCase().endsWith('.7z')){
    await ensureFiling();
    // The UMD/CDN build documents FilingBrowser. FilingBrowserWorker is an ESM export
    // and may not be compatible with the standalone UMD bundle.
    const BrowserExtractor=window.filing.FilingBrowser;
    if(!BrowserExtractor)throw new Error('Бібліотека завантажилась, але FilingBrowser відсутній у CDN-версії.');
    setStatus('Завантаження модуля 7-Zip…');
    const arc=new BrowserExtractor({wasmUrl:filingWasmUrl});
    setStatus('Розпакування архіву 7-Zip…');
    const entries=await arc.extract(file);
    configs=entries.filter(e=>(e.pathname||e.filename||'').toLowerCase().endsWith('.config'));
    if(!configs.length)throw new Error('В архіві не знайдено файлів .config.');
    configs=configs.map(e=>({...e,file:e.file || (e.data ? new File([e.data],e.filename||'config.config',{type:e.type||'application/xml'}) : null)})).filter(e=>e.file);
    if(!configs.length)throw new Error('Архів розпаковано, але бібліотека не повернула вміст файлу .config.');
  }else throw new Error('Підтримуються лише .config та .7z.');
  const reports=[];
  for(const item of configs){const raw=await item.file.text();reports.push(decodeConfig(raw,item.pathname||item.filename||file.name))}
  lastText=reports.join('\r\n\r\n'+'='.repeat(55)+'\r\n\r\n');
  lastName=file.name.replace(/\.(config|7z)$/i,'')+'.decoded.txt';
  renderReport(lastText);$('save').disabled=false;
  setStatus('Готово. Оброблено конфігурацій: '+configs.length);
 }catch(e){console.error(e);setStatus('Помилка: '+(e&&e.message?e.message:String(e)),false);$('result').textContent='ПОМИЛКА\n'+(e&&e.message?e.message:String(e));$('save').disabled=true}
}
const drop=$('drop');
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files.length)processFile(e.dataTransfer.files[0])});
$('file').addEventListener('change',e=>{if(e.target.files.length)processFile(e.target.files[0])});
$('save').addEventListener('click',()=>{const blob=new Blob(['\ufeff',lastText],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=lastName;a.click();URL.revokeObjectURL(a.href)});
$('clear').addEventListener('click',()=>{lastText='';$('result').innerHTML='<div class="report-empty">Тут з’явиться розшифрування параметрів City24.</div>';$('save').disabled=true;setStatus('Очікування файлу…')});
</script>
</body></html>
