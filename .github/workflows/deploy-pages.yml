name: Deploy City24 Decoder to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build self-contained site with local 7-Zip assets
        run: |
          mkdir -p /tmp/filing-package _site/vendor
          npm install --prefix /tmp/filing-package --no-save filing@0.1.2
          cp index.html _site/index.html
          echo "Installed Filing package files:"
          find /tmp/filing-package/node_modules/filing/dist -maxdepth 5 -type f -print
          JS_FILE="$(find /tmp/filing-package/node_modules/filing/dist/umd -maxdepth 2 -type f -name 'filing.browser.min.js' -print -quit)"
          WASM_FILE="$(find /tmp/filing-package/node_modules/filing/dist -type f -name 'archive.wasm' -print -quit)"
          if [ -z "$JS_FILE" ]; then
            echo "ERROR: Filing UMD JavaScript bundle was not found."
            exit 1
          fi
          if [ -z "$WASM_FILE" ]; then
            echo "ERROR: Filing archive.wasm was not found."
            exit 1
          fi
          cp "$JS_FILE" _site/vendor/filing.browser.min.js
          cp "$WASM_FILE" _site/vendor/archive.wasm
          printf '' > _site/.nojekyll
          echo "Packaged local Filing JS and WebAssembly:"
          ls -lh _site/vendor
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
